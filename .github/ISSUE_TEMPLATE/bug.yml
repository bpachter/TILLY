name: Bug
about: Report defects in runtime, data contracts, or tooling
title: "[Bug] "
labels:
  - type:bug
  - status:triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken and why it matters?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Numbered steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or validation output
      description: Paste relevant output.
  - type: checkboxes
    id: checklist
    attributes:
      label: Diagnostic checklist
      options:
        - label: Reproduced on latest main
        - label: Checked schema and cross-reference validation
        - label: Included seed and scenario context when applicable
